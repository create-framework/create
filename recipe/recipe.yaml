# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# The conda package, built from this checkout by `pixi run check-package`,
# and by the release workflow (.github/workflows/release.yml), which publishes
# it to the prefix.dev channel create-framework/create (see RELEASING.md).
context:
  version: ${{ env.get("CREATE_VERSION") }}

package:
  name: create
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  script:
    interpreter: bash
    content:
      - |
        set -euo pipefail
        mkdir -p "${PREFIX}/lib/mojo"
        mojo precompile src/create -o "${PREFIX}/lib/mojo/create.mojoc"
        # The compiled library the package calls into, found in lib/ through
        # CONDA_PREFIX or the run path (src/create/_native.mojo).
        sh scripts/build_native.sh "${PREFIX}/lib"
        # The project template create-cli's `create new` copies.
        mkdir -p "${PREFIX}/share/create"
        cp -R template "${PREFIX}/share/create/template"

requirements:
  build:
    - mojo-compiler =1.2
  host:
    - mojo-compiler =1.2
  run:
    # A .mojoc loads only on the compiler that built it.
    - ${{ pin_compatible('mojo-compiler', upper_bound='x.x') }}
    - sdl3 >=3.4,<4
    - freetype >=2.13,<3
    - libpng >=1.6,<2
    - libjpeg-turbo >=3,<4
    - libsndfile >=1.2,<2

tests:
  - script:
      - if: unix
        then:
          - mojo run test.mojo
          - test -f "${PREFIX}/share/create/template/main.mojo"
          - test -f "${PREFIX}/share/create/template/assets/logo.png"
    files:
      recipe:
        - test.mojo

about:
  homepage: https://github.com/create-framework/create
  repository: https://github.com/create-framework/create
  license: MIT
  license_file: LICENSE
  summary: Creative coding library for interactive graphics in Mojo

extra:
  maintainers:
    - Maelkiz
