[workspace]
authors = ["Karl Theodor Ruby <karl.ruby@tuta.com>"]
channels = ["conda-forge", "https://conda.modular.com/max"]
name = "create"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.1"

[activation]
scripts = ["scripts/activate.sh"]

[tasks]
example = { cmd = "bash scripts/example.sh", depends-on = ["precompile"] }
benchmark = { cmd = "bash scripts/benchmark.sh", depends-on = ["precompile"] }
test = "bash scripts/test.sh"
build-examples = "bash scripts/build_examples.sh"
check-standalone = "bash scripts/check_standalone.sh"
# Skipped while every input is unchanged since the last run (pixi's task cache,
# which also tracks the environment), so example and benchmark start from it.
precompile = { cmd = "mkdir -p build && mojo precompile \"$PIXI_PROJECT_ROOT/src/create\" -o build/create.mojoc", inputs = ["src/create/**/*.mojo"], outputs = ["build/create.mojoc"] }
embed-fonts = "sh scripts/embed_fonts.sh"
format = "mojo format src examples benchmarks tests"
setup = "git config core.hooksPath .githooks && git config blame.ignoreRevsFile .git-blame-ignore-revs"

[dependencies]
mojo = ">=1.2.0,<1.3"
sdl3 = ">=3.4,<4"
freetype = ">=2.13,<3"
libpng = ">=1.6,<2"
libjpeg-turbo = ">=3,<4"
libsndfile = ">=1.2,<2"

# rattler-build for `check-package` and the release workflow's upload, apart
# from the default environment: it builds the package in environments of its
# own.
[feature.package.dependencies]
rattler-build = ">=0.30.0,<0.31"

[feature.package.tasks]
check-package = "bash scripts/check_package.sh"

# The documentation site (zensical.toml): Zensical renders it, and the default
# feature's mojo writes the API reference's JSON (`mojo doc`).
[feature.docs.dependencies]
python = ">=3.12"
zensical = ">=0.1.1,<0.2"

[feature.docs.tasks]
docs = "python scripts/docs.py && zensical build --strict --clean"
docs-serve = "python scripts/docs.py && zensical serve"

[environments]
package = { features = ["package"], no-default-feature = true }
docs = { features = ["docs"], solve-group = "default" }
