name: Performance problem
description: A program runs slowly, stutters, or uses more memory or processor time than it should.
labels: [performance]
body:
  - type: markdown
    attributes:
      value: |
        Create aims to be fast by default, so a common operation that needs a workaround to run well is worth reporting. Numbers help most: `context.frame_rate()` is the current frames per second, and printing it now and then, or drawing it on the screen, shows how fast a program runs.

  - type: textarea
    id: what-is-slow
    attributes:
      label: What is slow
      description: What you saw, such as a low frame rate, a stutter every few seconds, a slow load or memory that keeps growing, and when it starts.
    validations:
      required: true

  - type: textarea
    id: measurements
    attributes:
      label: Measurements
      description: "The frame rate, frame time, load time or memory you measured, and how you measured it. A comparison helps: how many shapes it takes before the slowdown starts, or how a similar program runs in Processing or another library."
      placeholder: 60 frames a second with 1,000 circles, 12 with 5,000.
    validations:
      required: true

  - type: textarea
    id: program
    attributes:
      label: A program that shows it
      description: |
        The shortest complete program you can make that runs slowly. Start it with `from create import *`, so it runs as it is, and attach any image, font or sound it loads.
      render: mojo
      placeholder: |
        from create import *


        @fieldwise_init
        struct Slow(Program):
            @staticmethod
            def create(mut context: Context, mut canvas: Canvas) raises -> Slow:
                return Slow()

            def update(mut self, mut context: Context, mut canvas: Canvas) raises:
                canvas.fill(Color.BLUE)
                for i in range(5000):
                    canvas.circle((Float64(i % 100) * 12 - 600, Float64(i // 100) * 12 - 300), 5)
                if context.frame_count() % 60 == 0:
                    print(context.frame_rate())


        def main() raises:
            run[Slow]("Slow")
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Backend
      description: Which renderer is slow. If you can, try the program with both `RenderBackend.CPU` and `RenderBackend.GPU`.
      options:
        - Both CPU and GPU
        - CPU only
        - GPU only
        - Headless (run_headless)
        - Not about drawing
        - Don't know
    validations:
      required: true

  - type: input
    id: window
    attributes:
      label: Window and design size
      description: The window's mode and size on screen, and the design size passed to `run`. On the CPU, the time to draw grows with the window's pixels.
      placeholder: FULLSCREEN on a 2560×1440 display, design size 1280×720
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Create and Mojo versions
      description: "`pixi list create mojo`, run in your project, shows both. If you build Create from source, give the commit. Say too whether you start the program with `mojo run` or `mojo build`."
      placeholder: create 0.3.1, mojo 1.2.0, mojo run
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: Computer
      description: The operating system and version, the processor and the graphics card.
      placeholder: Ubuntu 24.04, AMD Ryzen 7 5800U, AMD Radeon integrated
    validations:
      required: true
