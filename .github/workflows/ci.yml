# The checks too slow for a commit hook. pre-commit covers formatting and the
# smoke build locally; everything else runs here, on every pull request and
# on main. Linux only: the macOS jobs are in macos.yml, run by hand.
#
# A change touching only inert paths (.githooks/_inert.sh, the list the hook
# skips on too) skips the checks. Not through `paths-ignore`: a required
# check that never starts stays pending and blocks the merge. The workflow
# always runs, and `ci`, the one required check, passes when the checks
# passed or were skipped.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# An explicit `shell: bash` runs steps with `-o pipefail`, which the default
# shell lacks: without it `pixi run test | tee test.log` exits as tee does, and
# a failing test passes the job.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          . .githooks/_inert.sh
          code=true
          # A diff that can't be taken (a first push) counts as code.
          if changed=$(git diff --name-only "$BASE...$GITHUB_SHA"); then
              code=false
              for path in $changed; do
                  is_inert "$path" || { code=true; break; }
              done
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      MOJO_CACHE: .pixi/envs/default/share/max/cache/.mojo_cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-format
            run: pixi run format && git diff --exit-code
            no-compile-cache: true
          - name: linux-precompile
            run: pixi run precompile
          # Examples, then a built program run outside the environment.
          - name: linux-examples
            run: pixi run build-examples && pixi run check-standalone
          # The conda package built and tested as installed. rattler-build
          # compiles in environments of its own, so no compile cache.
          - name: linux-package
            run: pixi run check-package
            no-compile-cache: true
          # The suite in four shards on four runners: built cold, after a
          # library change, it is about an hour of CPU, three times what one
          # runner gets through in the time the other checks take. GL tests
          # skip without a context; here a skip means the Mesa setup broke,
          # so it fails the job rather than passing silently.
          - name: linux-tests-1
            run: pixi run test --shard 1/4 | tee test.log && ! grep -q SKIP test.log
          - name: linux-tests-2
            run: pixi run test --shard 2/4 | tee test.log && ! grep -q SKIP test.log
          - name: linux-tests-3
            run: pixi run test --shard 3/4 | tee test.log && ! grep -q SKIP test.log
          - name: linux-tests-4
            run: pixi run test --shard 4/4 | tee test.log && ! grep -q SKIP test.log
    steps:
      - uses: actions/checkout@v7
      - name: Install Mesa EGL
        if: startsWith(matrix.name, 'linux-tests')
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true
          locked: true
      # Mojo's compile cache lives inside the environment, which setup-pixi
      # restores as installed: empty. Without this every run compiles every
      # test file cold, about eight times the CPU of a warm run. Entries are
      # content-keyed, so the latest cache for this toolchain serves any
      # commit; pull requests read main's.
      - name: Restore the Mojo compile cache
        if: ${{ !matrix.no-compile-cache }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MOJO_CACHE }}
          key: mojo-${{ matrix.name }}-${{ hashFiles('pixi.lock') }}-${{ github.sha }}
          restore-keys: mojo-${{ matrix.name }}-${{ hashFiles('pixi.lock') }}-
      # Every entry is marked unread, so those this run doesn't read can be
      # dropped before saving and the cache doesn't grow with each commit.
      - name: Mark the cache entries unread
        if: ${{ !matrix.no-compile-cache }}
        run: |
          mkdir -p "$MOJO_CACHE"
          find "$MOJO_CACHE" -type f -exec touch -a -t 200001010000 {} +
          touch "$RUNNER_TEMP/cache-marker"
      - run: ${{ matrix.run }}
      - name: Drop the entries this run didn't read
        if: ${{ !matrix.no-compile-cache }}
        run: find "$MOJO_CACHE" -type f ! -anewer "$RUNNER_TEMP/cache-marker" -delete
      - name: Save the Mojo compile cache
        if: ${{ !matrix.no-compile-cache }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.MOJO_CACHE }}
          key: mojo-${{ matrix.name }}-${{ hashFiles('pixi.lock') }}-${{ github.sha }}

  # The documentation site (zensical.toml), built strict: a broken link or
  # anchor, or a public name `mojo doc` can't find, fails it. Not gated on
  # `changes`, since a change to Markdown alone can break the site. On main
  # the built site is kept for `deploy-docs`.
  docs:
    name: linux-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true
          locked: true
          environments: docs
      - run: pixi run docs
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs/site

  # Publishes main's site to GitHub Pages, create-framework.org.
  deploy-docs:
    needs: docs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # The required check. A skipped matrix job reports under its unexpanded
  # name, not as linux-format/linux-precompile/..., so those can't be
  # required directly.
  ci:
    needs: [changes, check, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checks passed or were skipped
        run: |
          [ "${{ needs.docs.result }}" = success ] || exit 1
          case "${{ needs.changes.result }}/${{ needs.check.result }}" in
              success/success | success/skipped) exit 0 ;;
          esac
          exit 1
