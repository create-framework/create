# The Apple silicon checks, run by hand: Actions → macOS → Run workflow, on
# any branch. Not part of CI, which is Linux only: a macOS runner costs ten
# times a Linux one, and nobody runs Create on a Mac yet. Run it before a
# change that could behave differently there (windowing, GL, the library
# search) is relied on.
#
# The same steps as ci.yml's check job. Format and precompile are
# platform-independent enough that Linux covers them (and `pixi run test`
# precompiles anyway). Headless GL runs in a hidden Cocoa window, which the
# runner's desktop session supports, so a SKIP fails here too.
name: macOS

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: macos-15
    env:
      MOJO_CACHE: .pixi/envs/default/share/max/cache/.mojo_cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-examples
            run: pixi run build-examples && pixi run check-standalone
          - name: macos-tests
            run: pixi run test | tee test.log && ! grep -q SKIP test.log
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true
          locked: true
      # As in ci.yml: Mojo's compile cache, restored by toolchain and
      # trimmed to what this run read before it is saved.
      - name: Restore the Mojo compile cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MOJO_CACHE }}
          key: mojo-${{ matrix.name }}-${{ hashFiles('pixi.lock') }}-${{ github.sha }}
          restore-keys: mojo-${{ matrix.name }}-${{ hashFiles('pixi.lock') }}-
      - name: Mark the cache entries unread
        run: |
          mkdir -p "$MOJO_CACHE"
          find "$MOJO_CACHE" -type f -exec touch -a -t 200001010000 {} +
          touch "$RUNNER_TEMP/cache-marker"
      - run: ${{ matrix.run }}
      - name: Drop the entries this run didn't read
        run: find "$MOJO_CACHE" -type f ! -anewer "$RUNNER_TEMP/cache-marker" -delete
      - name: Save the Mojo compile cache
        uses: actions/cache/save@v6
        with:
          path: ${{ env.MOJO_CACHE }}
          key: mojo-${{ matrix.name }}-${{ hashFiles('pixi.lock') }}-${{ github.sha }}
