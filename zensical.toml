# The documentation site. Its pages are staged by scripts/docs.py from the
# README, docs/guide and docs/reference (which it generates from the docstrings); `pixi run docs` builds it,
# `pixi run docs-serve` previews it. scripts/docs_site.py publishes it at
# site_url, as main/ beside latest/, the newest release (docs.yml).
#
# The API reference's pages are generated, one per type and function, so its
# nav is too: scripts/docs.py writes this file to build/docs/zensical.toml
# with the reference added to the nav below, and the site is built from that.
[project]
site_name = "Create"
site_description = "A creative coding library for Mojo, inspired by Processing."
site_url = "https://create-framework.org/"
repo_url = "https://github.com/create-framework/create"
repo_name = "create-framework/create"
docs_dir = "build/docs/pages"
site_dir = "build/docs/site"
nav = [
  { "Home" = "index.md" },
  { "User guide" = [
    "guide/index.md",
    { "Basics" = [
      "guide/basics/index.md",
      "guide/basics/setup.md",
      "guide/basics/mojo.md",
      "guide/basics/programs.md",
      "guide/basics/coordinates.md",
      "guide/basics/coming-from-processing.md",
    ] },
    { "Drawing" = [
      "guide/drawing/index.md",
      "guide/drawing/canvas.md",
      "guide/drawing/style.md",
      "guide/drawing/colours.md",
      "guide/drawing/strokes.md",
      "guide/drawing/gradients.md",
      "guide/drawing/shadows.md",
      "guide/drawing/text.md",
      "guide/drawing/pixels.md",
    ] },
    { "Interaction" = [
      "guide/interaction/index.md",
      "guide/interaction/input.md",
      "guide/interaction/keyboard.md",
      "guide/interaction/typing.md",
      "guide/interaction/mouse.md",
      "guide/interaction/gamepads.md",
    ] },
    { "Motion" = [
      "guide/motion/index.md",
      "guide/motion/time.md",
      "guide/motion/tweens.md",
      "guide/motion/animations.md",
    ] },
    { "Geometry" = [
      "guide/geometry/index.md",
      "guide/geometry/shapes.md",
      "guide/geometry/curves.md",
      "guide/geometry/collisions.md",
    ] },
    { "Media" = [
      "guide/media/index.md",
      "guide/media/images.md",
      "guide/media/audio.md",
      "guide/media/capture.md",
    ] },
    { "Data" = [
      "guide/data/index.md",
      "guide/data/tables.md",
      "guide/data/json.md",
    ] },
    { "Maths" = [
      "guide/math/index.md",
      "guide/math/angles.md",
      "guide/math/points-and-vectors.md",
      "guide/math/matrices.md",
      "guide/math/interpolation.md",
      "guide/math/easing.md",
      "guide/math/random-numbers.md",
      "guide/math/noise.md",
    ] },
  ] },
]

[project.theme]
language = "en"
logo = "assets/logo/png/logo-trim.png"
favicon = "assets/logo/png/logo-trim.png"
features = [
  "content.code.copy",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
toc.toc_depth = 3
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
